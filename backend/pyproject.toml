[project]
name = "minutemind"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sniper15867", email = "nehitpahuja@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.4",
    "faster-whisper>=1.2.1",
    "numpy>=2.5.4",
    "nvidia-cublas-cu12>=12.4,<12.9",
    "nvidia-cudnn-cu12>=9,<10",
    "psutil>=7.2.2",
    "pyaudiowpatch>=0.2.12.9",
    "soxr>=1.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]
